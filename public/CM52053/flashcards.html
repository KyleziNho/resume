  {t:"Velasquez Paper",q:"ESSAY Q2 PREP — neurosymbolic approach for OFF-ROAD AUTONOMOUS DRIVING (PhysORD)?",a:"PhysORD CO-DESIGNS neural networks that estimate physical variables of the vehicle alongside the SYMBOLIC EQUATIONS that govern conservation laws of motion. Rather than distilling physics into the network or fitting physics post-hoc, the symbolic conservation laws are baked into the prediction pipeline as projection constraints. The neural component handles perception and parameter estimation from off-road terrain; the symbolic component enforces physically valid motion. The result: SOTA motion prediction with just 0.1% of the training TIME, 1% of the training DATA, and 96.9% fewer PARAMETERS than the leading purely neural baseline. With additional training the system further improves performance by 46% over state of the art — concrete evidence that strong symbolic priors give an alternative scaling axis to brute-force data and parameters."},

  // Concluding vision
  {t:"Velasquez Paper",q:"How does the paper position neurosymbolic AI relative to scaling laws?",a:"COMPLEMENTARY, not contradictory. The paper argues that data and compute scaling are valuable but must be COUNTERBALANCED by symbolic integration — just as Moore's law was balanced by Dennard scaling. Discovery (the bitter lesson) and the incorporation of prior knowledge (inductive biases) are not mutually exclusive. The hybrid feedback loop reduces scale while preserving generalisation."},
  {t:"Velasquez Paper",q:"Summarise the unified vision for neurosymbolic AI in the conclusion.",a:"A hybrid architecture: (1) data-driven neural reps as baseline capabilities; (2) LIFT neural reps to symbolic forms for logical reasoning; (3) PROJECT symbolic reps back to neural space for continued learning; (4) symbols can be discovered from data, incorporated from domain constraints, or refined by symbolic-guided exploration; (5) the symbolic system also distils knowledge from larger neural models, enabling smaller, more efficient deployments. A FEEDBACK LOOP between neural and symbolic where each guides the other."},
  {t:"Velasquez Paper",q:"What did the lecturer call the metaphor for the neurosymbolic architecture?",a:"'Heaven and earth' — neural-level computation happens 'on earth' (the mountainous loss landscape) while symbolic reasoning happens 'in the heavens' (the symbolic space above). The system lifts up to do symbolic updates, then projects back down. A platonic-style architecture where the symbolic layer is more abstract but trustworthy."},
  {t:"Velasquez Paper",q:"Why does the lecturer argue the symbolic level can be MORE trustworthy than neural?",a:"Because inference rules in propositional/first-order logic are SOUND — they can only take you from true statements to true statements (no hallucination). The 1980s-90s logic-based AI systems weren't computationally rich enough but they NEVER hallucinated. Modern LLMs are stochastic and can produce convincing nonsense. Lifting to the symbolic level lets you apply trustworthy inference, then project back."},
  {t:"Velasquez Paper",q:"How does the kangaroo example illustrate knowledge-graph reasoning?",a:"A car trained on US roads would have no training data for kangaroos, but a knowledge graph encoding (kangaroo, is-a, animal) and (animal-on-road, requires, slow-down) lets the system INFER the right behaviour without retraining. Knowledge graph embeddings place semantically similar entities (cow, deer, kangaroo) near each other in vector space — so reaction to one transfers to the others. This is generalisation via SYMBOLIC composition rather than statistical interpolation."},
];

const STORAGE_KEY = 'cm52053_flashcards_v1';

let deck = [...ALL_CARDS];
let idx = 0, got = 0, missed = 0;
let missed_cards = [];
let flipped = false;
let activeTopic = 'All';

const topics = ['All', ...new Set(ALL_CARDS.map(c => c.t))];

function saveState() {
  try {
    const state = {
      activeTopic,
      deckIndices: deck.map(c => ALL_CARDS.indexOf(c)),
      idx, got, missed,
      missedIndices: missed_cards.map(c => ALL_CARDS.indexOf(c))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const ind = document.getElementById('savedIndicator');
    if (ind) {
      ind.classList.add('show');
      clearTimeout(saveState._t);
      saveState._t = setTimeout(() => ind.classList.remove('show'), 1200);
    }
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.deckIndices) || s.deckIndices.length === 0) return false;
    activeTopic = s.activeTopic || 'All';
    deck = s.deckIndices.map(i => ALL_CARDS[i]).filter(Boolean);
    idx = Math.min(s.idx || 0, deck.length);
    got = s.got || 0;
    missed = s.missed || 0;
    missed_cards = (s.missedIndices || []).map(i => ALL_CARDS[i]).filter(Boolean);
    return true;
  } catch (e) { return false; }
}

function resetProgress() {
  if (!confirm('Reset all flashcard progress?')) return;
  localStorage.removeItem(STORAGE_KEY);
  activeTopic = 'All';
  deck = [...ALL_CARDS];
  shuffle(deck);
  idx = 0; got = 0; missed = 0; missed_cards = [];
  flipped = false;
  document.getElementById('doneMsg').style.display = 'none';
  document.getElementById('cardWrap').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  renderTopicBar();
  render();
}

function renderTopicBar() {
  document.getElementById('topicBar').innerHTML = topics.map(t =>
    `<button class="fc-topic-btn${t===activeTopic?' active':''}" onclick="setTopic('${t.replace(/'/g, "\\'")}')">${t}</button>`
  ).join('');
}

function setTopic(t) {
  activeTopic = t;
  renderTopicBar();
  deck = (t === 'All' ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.t === t));
  shuffle(deck);
  idx = 0; got = 0; missed = 0; missed_cards = [];
  flipped = false;
  document.getElementById('doneMsg').style.display = 'none';
  document.getElementById('cardWrap').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  saveState();
  render();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function shuffleCards() { setTopic(activeTopic); }

function render() {
  if (idx >= deck.length) {
    document.getElementById('cardWrap').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('doneMsg').style.display = 'block';
    updateScore();
    return;
  }
  const c = deck[idx];
  document.getElementById('cardTopic').textContent = c.t;
  document.getElementById('cardQ').textContent = c.q;
  document.getElementById('cardA').textContent = c.a;
  document.getElementById('progress').textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  document.getElementById('controls').style.display = 'none';
  updateScore();
}

function flipCard() {
  if (idx >= deck.length) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (flipped) document.getElementById('controls').style.display = 'flex';
}

function rate(correct) {
  if (correct) got++; else { missed++; missed_cards.push(deck[idx]); }
  idx++;
  saveState();
  render();
}

function updateScore() {
  document.getElementById('scoreG').textContent = got;
  document.getElementById('scoreB').textContent = missed;
  document.getElementById('scoreR').textContent = Math.max(0, deck.length - idx);
}

function restartMissed() {
  if (missed_cards.length === 0) { restartAll(); return; }
  deck = [...missed_cards];
  shuffle(deck);
  idx = 0; got = 0; missed = 0; missed_cards = [];
  flipped = false;
  document.getElementById('doneMsg').style.display = 'none';
  document.getElementById('cardWrap').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  saveState();
  render();
}

function restartAll() { setTopic(activeTopic); }

if (!loadState()) {
  shuffle(deck);
}
renderTopicBar();
render();
</script>
