<script>
const ALL_CARDS = [
  // ── SVM ───────────────────────────────────────────────────────────────────
  {t:"SVM",q:"What does SVM do?",a:"Finds the hyperplane (line) that separates two classes with the maximum margin (widest gap)."},
  {t:"SVM",q:"What is the margin width formula?",a:"Margin = 2 / ‖w‖, where w is the weight vector read from the decision boundary equation."},
  {t:"SVM",q:"How do you read w from the equation?",a:"From w₁x₁ + w₂x₂ + b = 0, w = (w₁, w₂). E.g. 3x₁ + 4x₂ − 2 = 0 → w = (3, 4)."},
  {t:"SVM",q:"How do you compute ‖w‖?",a:"‖w‖ = √(w₁² + w₂²). E.g. w = (3, 4) → ‖w‖ = √(9+16) = √25 = 5."},
  {t:"SVM",q:"Example margin calculation?",a:"3x₁ + 4x₂ − 2 = 0 → w = (3,4) → ‖w‖ = 5 → margin = 2/5 = 0.4."},
  {t:"SVM",q:"What are support vectors?",a:"The data points sitting exactly on the margin boundaries. The SVM solution depends only on these points."},
  {t:"SVM",q:"Why does SVM use y = +1 and −1 instead of 1 and 0?",a:"So both margin constraints combine into one inequality: yᵢ(w·xᵢ + b) ≥ 1."},
  {t:"SVM",q:"What is the soft margin SVM objective?",a:"Minimise ½‖w‖² + C Σξᵢ. First term = wide margin. Second term = penalty for mistakes. C controls the trade-off."},
  {t:"SVM",q:"What is ξᵢ (the slack variable)?",a:"Measures how far point i falls short of being safely outside the margin. ξ = max(0, 1 − yᵢ(wᵀxᵢ + b))."},
  {t:"SVM",q:"What does ξ = 0 mean?",a:"Point is correctly classified and outside the margin. No problem."},
  {t:"SVM",q:"What does 0 < ξ < 1 mean?",a:"Point is on the correct side but inside the margin. Minor violation."},
  {t:"SVM",q:"What does ξ = 1 mean?",a:"Point is exactly on the decision boundary. Zero confidence."},
  {t:"SVM",q:"What does ξ > 1 mean?",a:"Point is misclassified — on the wrong side of the decision boundary."},
  {t:"SVM",q:"How to quickly check if a point is misclassified?",a:"Compute wᵀx + b. If its sign matches the label y, correct. If signs disagree, misclassified."},
  {t:"SVM",q:"What does large C do?",a:"Heavily penalises mistakes → narrow margin → overfitting risk."},
  {t:"SVM",q:"What does small C do?",a:"Tolerates mistakes → wide margin → underfitting risk."},
  {t:"SVM",q:"What is the kernel trick?",a:"Replace dot products xᵢᵀxⱼ with K(xᵢ, xⱼ) to implicitly work in a higher-dimensional space without ever computing the mapping."},
  {t:"SVM",q:"What are the three common kernels?",a:"Linear: K = xᵀz. Polynomial: K = (xᵀz + c)ᵈ. RBF: K = exp(−γ‖x−z‖²)."},
  {t:"SVM",q:"What does the RBF kernel compute?",a:"Similarity between two points based on distance. Close points → K near 1. Far points → K near 0."},
  {t:"SVM",q:"What does γ do in the RBF kernel?",a:"Controls how far each point's influence reaches. Small γ = smooth boundary (underfitting). Large γ = wiggly boundary (overfitting)."},
  {t:"SVM",q:"Why normalise features when using RBF?",a:"RBF uses Euclidean distance. Features with larger scales dominate the distance calculation, making smaller-scale features invisible."},
  {t:"SVM",q:"How do C and γ interact?",a:"Both small → underfitting. Both large → overfitting. Best found by cross-validation (grid search)."},
  {t:"SVM",q:"Does C change the shape of the decision boundary?",a:"No. C changes the margin width. Only γ (with RBF kernel) changes the shape."},

  // ── MLP ───────────────────────────────────────────────────────────────────
  {t:"MLP",q:"What is the perceptron formula?",a:"y = g(wᵀx + b). Weighted sum of inputs, add bias, apply activation function."},
  {t:"MLP",q:"What does wᵀx mean?",a:"Dot product: w₁x₁ + w₂x₂ + ... + wₙxₙ. Multiply each input by its weight and add up."},
  {t:"MLP",q:"What is sigmoid and when is it used?",a:"σ(x) = 1/(1+e⁻ˣ). Outputs (0,1). Used for output layer of binary classification."},
  {t:"MLP",q:"What is sigmoid(0)?",a:"0.5. Maximum uncertainty."},
  {t:"MLP",q:"What is ReLU and when is it used?",a:"max(0, x). Outputs [0, ∞). Used for hidden layers. Most commonly used activation."},
  {t:"MLP",q:"What is softmax and when is it used?",a:"eᶻⁱ / Σeᶻʲ. Converts scores to probabilities summing to 1. Used for output layer of multi-class classification."},
  {t:"MLP",q:"What is tanh?",a:"(eˣ − e⁻ˣ)/(eˣ + e⁻ˣ). Outputs (−1, 1). Used in LSTM gates."},
  {t:"MLP",q:"Why are non-linear activations essential?",a:"Without them, stacking layers collapses to a single linear transformation. Non-linearity lets the network model complex patterns."},
  {t:"MLP",q:"What is the dying ReLU problem?",a:"When input is negative, ReLU outputs 0 and gradient is 0. The neurone stops learning permanently. Leaky ReLU fixes this."},
  {t:"MLP",q:"What is the Universal Approximation Theorem?",a:"A neural network with one hidden layer and non-linear activations can approximate any continuous function."},
  {t:"MLP",q:"How many parameters in a fully connected layer?",a:"(nᵢₙ × nₒᵤₜ) + nₒᵤₜ. The nₒᵤₜ is for biases (one per output neurone)."},
  {t:"MLP",q:"Example: 512 inputs → 256 outputs?",a:"(512 × 256) + 256 = 131,072 + 256 = 131,328 parameters."},
  {t:"MLP",q:"What is MSE loss?",a:"(1/N) Σ(y − ŷ)². Used for regression. Measures average squared error."},
  {t:"MLP",q:"What is Binary Cross-Entropy loss?",a:"−(1/N) Σ [y·log(ŷ) + (1−y)·log(1−ŷ)]. Used for binary classification."},
  {t:"MLP",q:"BCE shortcut?",a:"y=1 → just compute log(ŷ). y=0 → just compute log(1−ŷ). Add up, divide by N, negate."},
  {t:"MLP",q:"What is the gradient descent update rule?",a:"w ← w − η × ∂L/∂w. Move weights in the direction that reduces loss."},
  {t:"MLP",q:"What does the learning rate η control?",a:"Step size. Too small → slow convergence. Too large → overshooting, divergence."},
  {t:"MLP",q:"What activation + loss for binary classification?",a:"Sigmoid output + Binary Cross-Entropy loss."},
  {t:"MLP",q:"What activation + loss for multi-class classification?",a:"Softmax output + Multi-class Cross-Entropy loss."},
  {t:"MLP",q:"What activation + loss for regression?",a:"Linear (no activation) output + MSE loss."},

  // ── CNN ───────────────────────────────────────────────────────────────────
  {t:"CNN",q:"Why not use MLP for images?",a:"Loses spatial information when flattened. Far too many parameters (millions for one layer)."},
  {t:"CNN",q:"What does a convolutional layer do?",a:"Slides a small filter (magnifying glass) over the image, computing element-wise multiply + sum at each position to produce a feature map."},
  {t:"CNN",q:"CNN output size formula?",a:"W₂ = (W₁ − F + 2P) / S + 1. D₂ = K (number of filters)."},
  {t:"CNN",q:"What is W₁, F, P, S?",a:"W₁ = input width, F = filter size, P = padding, S = stride."},
  {t:"CNN",q:"Default assumptions if P and S not given?",a:"Stride = 1, Padding = 0."},
  {t:"CNN",q:"What is same padding?",a:"P = (F−1)/2 with stride 1. Output is same spatial size as input."},
  {t:"CNN",q:"What is stride?",a:"How many pixels the filter jumps each step. Bigger stride = smaller output."},
  {t:"CNN",q:"What is padding?",a:"Zeros added around the border. Lets the filter reach the edges properly."},
  {t:"CNN",q:"How many parameters in a conv layer?",a:"K × (F × F × D₁) + K. K = filters, F = filter size, D₁ = input depth. +K for biases."},
  {t:"CNN",q:"Example: 24 filters of 5×5, input depth 3?",a:"24 × (5×5×3) + 24 = 24 × 75 + 24 = 1800 + 24 = 1,824."},
  {t:"CNN",q:"Why do CNNs use far fewer parameters than FC layers?",a:"Local connectivity (filter only sees a small patch) and parameter sharing (same filter used everywhere). Parameter count is independent of image size."},
  {t:"CNN",q:"What is the receptive field?",a:"The region of the original input that influences one output value. Stacking two 3×3 layers gives a 5×5 receptive field."},
  {t:"CNN",q:"What are the four key properties of conv layers?",a:"1) Preserves spatial relationships. 2) Local connectivity. 3) Parameter sharing. 4) Hierarchical features (edges → textures → objects)."},

  // ── TRAINING ──────────────────────────────────────────────────────────────
  {t:"Training",q:"What are the three gradient descent variants?",a:"Batch GD (whole dataset), Mini-batch GD (subset, e.g. 32), Stochastic GD (1 sample). Mini-batch is used in practice."},
  {t:"Training",q:"How to compute iterations per epoch?",a:"⌈N / batch_size⌉. E.g. 2000 samples, batch 64 → ⌈2000/64⌉ = 32 iterations."},
  {t:"Training",q:"What is an epoch?",a:"One complete pass through the entire training dataset."},
  {t:"Training",q:"What is Adam optimiser?",a:"Automatically adjusts learning rate per parameter. Best default choice. Works well without extensive tuning."},
  {t:"Training",q:"What is learning rate decay?",a:"Start with high learning rate, reduce over time. E.g. halve every 30 epochs."},
  {t:"Training",q:"What is the vanishing gradient problem?",a:"During backprop, gradients shrink exponentially through layers (sigmoid derivative max = 0.25). Early layers stop learning."},
  {t:"Training",q:"What are the four solutions to vanishing gradients?",a:"1) ReLU activation (derivative = 1). 2) He initialisation (better starting weights). 3) Batch normalisation (stable activations). 4) Skip connections/ResNet (gradient always at least 1)."},
  {t:"Training",q:"How do skip connections (ResNet) help?",a:"Output = F(x) + x. Gradient = ∂F/∂x + 1. Even if ∂F/∂x ≈ 0, gradient is at least 1."},
  {t:"Training",q:"Do skip connections add extra parameters?",a:"No. The identity shortcut is just addition. Zero parameters."},
  {t:"Training",q:"What is He initialisation for?",a:"ReLU layers. Sets starting weights with variance 2/n to prevent vanishing/exploding signals. NOT for overfitting."},
  {t:"Training",q:"What is Xavier/Glorot initialisation for?",a:"Sigmoid/tanh layers. Variance 1/n."},
  {t:"Training",q:"What is batch normalisation?",a:"Normalises outputs of each layer within each mini-batch. Stabilises training, allows higher learning rates."},
  {t:"Training",q:"How to diagnose overfitting?",a:"Training loss low, validation loss high. Growing gap between them."},
  {t:"Training",q:"How to diagnose underfitting?",a:"Both training and validation loss are high."},
  {t:"Training",q:"What is L2 regularisation?",a:"Adds λΣwᵢ² to loss. Penalises large weights. Encourages simpler models. Most commonly used."},
  {t:"Training",q:"What is L1 regularisation?",a:"Adds λΣ|wᵢ| to loss. Pushes some weights to exactly 0 (feature selection)."},
  {t:"Training",q:"What does λ too high do?",a:"Forces weights too close to zero → underfitting."},
  {t:"Training",q:"What is dropout?",a:"Randomly deactivates a fraction of neurones each training iteration. Different neurones each time. Prevents co-adaptation."},
  {t:"Training",q:"Is dropout applied during testing?",a:"NO. Only during training. Full network used at test time."},
  {t:"Training",q:"What is early stopping?",a:"Monitor validation loss. Stop when it hasn't improved for a set number of epochs (patience)."},
  {t:"Training",q:"What is data augmentation?",a:"Artificially expand training data with transformations (flips, rotations, crops, colour changes)."},
  {t:"Training",q:"What is transfer learning?",a:"Reuse a model pre-trained on a large dataset (ImageNet). Fine-tune on your smaller dataset. Prevents overfitting on small data."},
  {t:"Training",q:"Which techniques solve vanishing gradients?",a:"ReLU, skip connections, He initialisation, batch normalisation."},
  {t:"Training",q:"Which techniques solve overfitting?",a:"Dropout, L1/L2 regularisation, early stopping, data augmentation, transfer learning."},
  {t:"Training",q:"Does dropout solve vanishing gradients?",a:"NO. Dropout prevents overfitting. It has nothing to do with gradients."},
  {t:"Training",q:"Does Xavier initialisation prevent overfitting?",a:"NO. It prevents vanishing/exploding gradients at the start of training."},

  // ── TRANSFORMERS ──────────────────────────────────────────────────────────
  {t:"Transformers",q:"Why were transformers invented?",a:"RNNs are slow (sequential processing), have encoding bottlenecks, and struggle with long sequences. Transformers process all tokens simultaneously."},
  {t:"Transformers",q:"What is self-attention?",a:"Each word looks at every other word to understand its meaning in context. Computes relevance scores between all pairs of words."},
  {t:"Transformers",q:"What are Query, Key, Value?",a:"Query = what am I looking for? Key = what do I contain? Value = what information do I carry? Computed by multiplying word embeddings by learned matrices Wq, Wk, Wv."},
  {t:"Transformers",q:"What are the four steps of self-attention?",a:"1) Compute Q, K, V. 2) Dot product of Q with each K (scores). 3) Scale by √D' and softmax (weights). 4) Weighted sum of V vectors (output)."},
  {t:"Transformers",q:"What is the self-attention matrix formula?",a:"Z = softmax(QKᵀ / √D') × V"},
  {t:"Transformers",q:"Why divide by √D'?",a:"Prevents scores from getting too extreme before softmax, which would create extreme probabilities."},
  {t:"Transformers",q:"How to compute self-attention by hand?",a:"Step 1: q·k₁ and q·k₂ (dot products). Step 2: softmax([score1, score2]) → weights summing to 1. Step 3: weight1×v₁ + weight2×v₂ → output."},
  {t:"Transformers",q:"Sanity checks for self-attention?",a:"Weights must sum to 1. Output must be between v₁ and v₂. Output leans toward the v with the higher weight."},
  {t:"Transformers",q:"Why multiple heads?",a:"Each head captures a different type of relationship (grammar, reference, meaning). One head isn't enough."},
  {t:"Transformers",q:"How does multi-head attention work?",a:"Run self-attention H times in parallel with different W matrices. Concatenate outputs. Multiply by Wo."},
  {t:"Transformers",q:"What is the size of the Wo matrix?",a:"(H × D') × D. Rows = concatenated size from all heads. Columns = original embedding dimension."},
  {t:"Transformers",q:"What is the output dimension of multi-head attention?",a:"Same as the input dimension D. Always. Required for residual connections."},
  {t:"Transformers",q:"What are the components of a transformer block?",a:"1) Multi-head self-attention. 2) Residual connection + Layer norm. 3) Position-wise feed-forward network. 4) Another residual connection + Layer norm."},
  {t:"Transformers",q:"Which component is the ONLY one where tokens interact?",a:"Multi-head self-attention. Everything else operates on each token independently."},
  {t:"Transformers",q:"What is layer normalisation?",a:"Normalises across the feature dimension for each individual token. Used in transformers (unlike batch norm which normalises across the batch)."},
  {t:"Transformers",q:"What is positional encoding?",a:"Adds position information to word embeddings. Without it, the transformer treats words as an unordered set."},
  {t:"Transformers",q:"What are the five criteria for positional encoding?",a:"1) Unique per position. 2) Consistent distance for same gap. 3) Bounded. 4) Generalises to longer sequences. 5) Deterministic. NOT monotonically increasing."},
  {t:"Transformers",q:"What is the sinusoidal positional encoding formula?",a:"PE(pos,2i) = sin(pos/10000^(2i/d)), PE(pos,2i+1) = cos(pos/10000^(2i/d)). This is provided in the exam."},
  {t:"Transformers",q:"What is masked self-attention?",a:"Each token can only attend to previous tokens. Future positions set to −∞ before softmax (so their weight becomes 0)."},
  {t:"Transformers",q:"Mask formula?",a:"Mᵢⱼ = 0 if j ≤ i (allowed), −∞ if j > i (blocked). 0-indexed."},
  {t:"Transformers",q:"How to quickly apply a mask?",a:"Position i (0-indexed) keeps the first i+1 scores, masks the rest as −∞."},
  {t:"Transformers",q:"What is BERT?",a:"Encoder-only transformer. Bidirectional attention (sees all tokens). Pre-trained with masked language modelling."},
  {t:"Transformers",q:"What is GPT?",a:"Decoder-only transformer. Masked attention (only sees previous tokens). Pre-trained to predict next token."},
  {t:"Transformers",q:"What is an encoder-decoder transformer?",a:"Original transformer for translation. Encoder uses bidirectional attention. Decoder uses masked attention + cross-attention to encoder output."},

  // ── GANs ──────────────────────────────────────────────────────────────────
  {t:"GANs",q:"What is a GAN?",a:"Two networks competing: Generator creates fake data from noise. Discriminator classifies real vs fake."},
  {t:"GANs",q:"What does the Generator do?",a:"Takes random noise vector z → produces fake image G(z). Wants to fool the discriminator."},
  {t:"GANs",q:"What does the Discriminator do?",a:"Takes image (real or fake) → outputs probability it's real (0=fake, 1=real)."},
  {t:"GANs",q:"What does D(x) represent?",a:"Discriminator's output for a real image. Should be close to 1."},
  {t:"GANs",q:"What does D(G(z)) represent?",a:"Discriminator's output for a fake image. D wants it close to 0. G wants it close to 1."},
  {t:"GANs",q:"How is a GAN trained?",a:"Alternating. Step 1: train D (freeze G). Step 2: train G (freeze D). Repeat."},
  {t:"GANs",q:"What happens at equilibrium (perfect GAN)?",a:"D(anything) = 0.5. The discriminator can't tell real from fake."},
  {t:"GANs",q:"What is the generator loss (non-saturating)?",a:"L_G = −(1/N) Σ ln(D(G(zᵢ))). Steps: ln each D value → add → ÷ N → negate."},
  {t:"GANs",q:"Example: D(G(z₁))=0.2, D(G(z₂))=0.5, D(G(z₃))=0.8?",a:"ln(0.2)=−1.609, ln(0.5)=−0.693, ln(0.8)=−0.223. Sum=−2.525. ÷3=−0.842. Negate=0.842."},
  {t:"GANs",q:"What is the discriminator loss?",a:"L_D = −(1/N)[Σ ln D(xᵢ) + Σ ln(1 − D(G(zᵢ)))]. Two parts: real images + fake images."},
  {t:"GANs",q:"How to compute the fake part of discriminator loss?",a:"Compute (1−D(G(z))) for each, then ln, then add. E.g. D(G(z))=0.3 → 1−0.3=0.7 → ln(0.7)=−0.357."},
  {t:"GANs",q:"What is the min-max formulation?",a:"min_G max_D E[log D(x)] + E[log(1 − D(G(z)))]. D maximises (classifies correctly). G minimises (fools D)."},
  {t:"GANs",q:"Why use non-saturating loss instead of original?",a:"Early in training, D(G(z))≈0. Original loss log(1−D(G(z)))≈log(1)=0 → flat gradient, G can't learn. Non-saturating −log(D(G(z)))=−log(0.01)=4.6 → strong gradient."},
  {t:"GANs",q:"What is a conditional GAN?",a:"Adds condition y (e.g. class label) to both G and D. G receives (z, y) → generates class-specific images. D receives (image, y) → judges: is this a real image OF THIS CLASS?"},
  {t:"GANs",q:"Why does D need the condition?",a:"Without it, G could generate a perfect dog when asked for a cat, and D would say it looks real. With the condition, D catches the mismatch."},
  {t:"GANs",q:"What is DCGAN?",a:"Deep Convolutional GAN. Generator uses transposed convolutions (upsampling). Discriminator is a standard CNN. Discriminator uses Leaky ReLU."},
  {t:"GANs",q:"What is super-resolution (SRGAN)?",a:"Generator upscales low-resolution image. Loss combines GAN loss with perceptual content loss (features from pre-trained CNN, not pixel-level)."},

  // ── RNN / LSTM ────────────────────────────────────────────────────────────
  {t:"RNN/LSTM",q:"What is an RNN?",a:"Processes sequences one step at a time. At each step: hₜ = tanh(W[hₜ₋₁, xₜ] + b). Combines previous memory with current input."},
  {t:"RNN/LSTM",q:"What is hₜ₋₁?",a:"The hidden state from the previous time step. The RNN's memory of everything it's seen so far."},
  {t:"RNN/LSTM",q:"Why are RNNs bad at long sequences?",a:"Vanishing gradients across time steps. By word 50, the gradient from word 1 is essentially zero."},
  {t:"RNN/LSTM",q:"What is LSTM?",a:"RNN with three gates controlling information flow. Solves the vanishing gradient problem for sequences."},
  {t:"RNN/LSTM",q:"What are the three LSTM gates?",a:"Forget gate (what to throw away), Input gate (what new info to store), Output gate (what to reveal now). All use sigmoid (outputs 0-1)."},
  {t:"RNN/LSTM",q:"What are the two LSTM states?",a:"Cell state (long-term memory, conveyor belt) and Hidden state (short-term memory, current output)."},
  {t:"RNN/LSTM",q:"LSTM cell state update?",a:"cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ c̃ₜ. New memory = (what I keep from old) + (what I add new)."},
  {t:"RNN/LSTM",q:"What does ⊙ mean?",a:"Element-wise multiplication. [a,b,c] ⊙ [d,e,f] = [ad, be, cf]."},
  {t:"RNN/LSTM",q:"Why were LSTMs replaced by Transformers?",a:"Sequential processing (can't parallelise), encoding bottleneck, limited transfer learning. Transformers process all tokens at once."},

  // ── GENERATIVE MODELS ─────────────────────────────────────────────────────
  {t:"Generative",q:"What is the difference between discriminative and generative models?",a:"Discriminative learns decision boundary P(y|x). Generative learns data distribution P(x) and can create new samples."},
  {t:"Generative",q:"Name five types of generative models.",a:"VAE, GAN, Autoregressive (GPT), Normalising Flows, Diffusion Models."},
  {t:"Generative",q:"What are diffusion models?",a:"Forward process adds noise until data becomes pure noise. Reverse process learns to denoise step by step. State of the art for image generation (DALL-E, Stable Diffusion)."},

  // ── SEARCH ────────────────────────────────────────────────────────────────
  {t:"Search",q:"What is BFS?",a:"Breadth-First Search. Explores level by level using a queue (FIFO). Complete. Optimal with equal costs. O(b^d) time and space."},
  {t:"Search",q:"What is DFS?",a:"Depth-First Search. Goes as deep as possible using a stack (LIFO). Not complete. Not optimal. O(bm) time, O(bm) space."},
  {t:"Search",q:"What is Uniform Cost Search?",a:"Like BFS but expands cheapest path first using a priority queue. Complete. Optimal for any positive costs."},
  {t:"Search",q:"What is A* search?",a:"Expands node with lowest f(n) = g(n) + h(n). g = actual cost so far. h = estimated cost to goal. Optimal if h is admissible."},
  {t:"Search",q:"What does admissible mean?",a:"The heuristic never overestimates. h(n) ≤ true cost. Always optimistic."},
  {t:"Search",q:"What is Greedy Best-First Search?",a:"Expands node with lowest h(n) only. Fast but not optimal."},
  {t:"Search",q:"What is Hill Climbing?",a:"Always move to best neighbour. Gets stuck at local maxima."},
  {t:"Search",q:"What is Simulated Annealing?",a:"Like hill climbing but sometimes accepts worse moves. Probability decreases over time. Can escape local maxima."},

  // ── ADVERSARIAL SEARCH ────────────────────────────────────────────────────
  {t:"Adversarial",q:"What is Minimax?",a:"Two-player game algorithm. MAX maximises score, MIN minimises. Build game tree, propagate values from leaves up."},
  {t:"Adversarial",q:"How to solve a minimax tree?",a:"Work from bottom up. At MIN nodes, take the minimum of children. At MAX nodes, take the maximum."},
  {t:"Adversarial",q:"What is alpha-beta pruning?",a:"Same result as minimax but skips branches that can't affect the decision. Prune when α ≥ β."},
  {t:"Adversarial",q:"What is α?",a:"Best value MAX can guarantee so far. Starts at −∞."},
  {t:"Adversarial",q:"What is β?",a:"Best value MIN can guarantee so far. Starts at +∞."},

  // ── PROBABILITY ───────────────────────────────────────────────────────────
  {t:"Probability",q:"What is Bayes' Theorem?",a:"P(A|B) = P(B|A) × P(A) / P(B). Probability of A given B = how much A causes B, divided by all ways B happens."},
  {t:"Probability",q:"How to compute P(B) (total probability)?",a:"P(B) = P(B|A)×P(A) + P(B|¬A)×P(¬A). Sum over all ways B can happen."},
  {t:"Probability",q:"What is a Naive Bayes classifier?",a:"Assumes all features are conditionally independent given the class. P(class|features) ∝ P(class) × P(f₁|class) × P(f₂|class) × ..."},
  {t:"Probability",q:"How to classify with Naive Bayes?",a:"Compute the product for each class. Pick the class with the larger product. No need to normalise."},
  {t:"Probability",q:"What are knowledge graphs?",a:"Encode facts as triples: (subject, predicate, object). E.g. (cow, is-a, animal). Nodes = entities, edges = relationships."},

  // ── MDPs ──────────────────────────────────────────────────────────────────
  {t:"MDPs",q:"What is an MDP?",a:"Markov Decision Process. States, actions, transition probabilities, rewards, discount factor γ."},
  {t:"MDPs",q:"What is the discount factor γ?",a:"How much future rewards are valued vs immediate. γ close to 0 = short-sighted. γ close to 1 = far-sighted."},
  {t:"MDPs",q:"How to compute discounted reward?",a:"R₀ + γR₁ + γ²R₂ + ... E.g. γ=0.9, rewards [10,10,10] → 10 + 9 + 8.1 = 27.1."},
  {t:"MDPs",q:"What is the Bellman equation?",a:"V(s) = R(s) + γ × max_a Σ T(s,a,s') × V(s'). Value = immediate reward + best discounted future."},

  // ── NEURO-SYMBOLIC ────────────────────────────────────────────────────────
  {t:"Neuro-Symbolic",q:"What is neuro-symbolic AI?",a:"Hybrid approach combining neural (deep learning, pattern recognition) with symbolic (logic, knowledge graphs, rules)."},
  {t:"Neuro-Symbolic",q:"What are limitations of pure deep learning?",a:"Hallucinations, lack of common sense, poor interpretability, unsustainable scaling."},
  {t:"Neuro-Symbolic",q:"What are strengths of symbolic AI?",a:"Trustworthiness (sound inference), interpretability (explainable reasoning), common-sense knowledge."},
  {t:"Neuro-Symbolic",q:"What are the four operations in Velasquez et al.?",a:"1) Data-driven update (gradient descent). 2) Lift (neural → symbolic). 3) Symbolic update (apply domain knowledge). 4) Projection (symbolic → neural)."},
  {t:"Neuro-Symbolic",q:"What is System 1 vs System 2 (Kahneman)?",a:"System 1 = fast, automatic, intuitive (5×4=20). System 2 = slow, deliberate, effortful (547×27)."},
  {t:"Neuro-Symbolic",q:"What is the scaling problem?",a:"AI model parameters double every 4-6 months. AI uses ~5% of US electricity. Physically and economically unsustainable."},
  {t:"Neuro-Symbolic",q:"How does neuro-symbolic AI address scaling?",a:"Symbolic knowledge can shortcut the learning process, bypassing difficult terrain in the loss landscape that would need many gradient steps."},

  // ── EXAM FORMAT ───────────────────────────────────────────────────────────
  {t:"Exam Format",q:"What is the exam format?",a:"16 MCQs (66 marks, mix of 3 and 6 mark questions) + 1 essay (34 marks) = 100 marks total."},
  {t:"Exam Format",q:"What topics do MCQs cover?",a:"Entire year — search, probability/ML, and deep learning, split roughly evenly (~22 marks each)."},
  {t:"Exam Format",q:"What is the essay about?",a:"Choose one of three neuro-symbolic AI papers. Two known paragraphs (9+9 marks) + one unseen part (16 marks)."},
  {t:"Exam Format",q:"Are formulae provided?",a:"Some are provided (marked green on the equation sheet). Others must be memorised (marked red)."},
  {t:"Exam Format",q:"Key formulas to memorise?",a:"SVM margin (2/‖w‖), activation functions, FC params (nᵢₙ×nₒᵤₜ+nₒᵤₜ), CNN output size, CNN params (K(F²D₁)+K), self-attention (softmax(QKᵀ/√D')V), GAN losses."},

  // ── BACKPROPAGATION ──────────────────────────────────────────────────────
  {t:"Training",q:"Why does backpropagation use the chain rule?",a:"To compute how the loss changes with respect to weights in early layers, you multiply partial derivatives layer by layer backwards. Each layer contributes one factor in the chain."},
  {t:"Training",q:"Sigmoid's derivative has maximum value 0.25. After 10 layers of sigmoid, what is the maximum possible gradient?",a:"0.25¹⁰ = 0.00000095. Essentially zero. This is why sigmoid causes vanishing gradients in deep networks."},
  {t:"Training",q:"ReLU's derivative is 1 for positive inputs. After 10 layers of ReLU (all positive), what is the gradient?",a:"1¹⁰ = 1. No shrinkage at all. Gradient passes through unchanged. That's why ReLU solves vanishing gradients."},

  // ── BATCH SIZE EFFECTS ───────────────────────────────────────────────────
  {t:"Training",q:"What happens if you increase the batch size from 32 to 512?",a:"Fewer iterations per epoch (N/512 instead of N/32). Each gradient is more accurate (less noisy) but training may converge to sharper minima. Also uses more memory."},
  {t:"Training",q:"What happens if batch size = 1?",a:"Stochastic gradient descent. Very noisy gradients. Updates are fast but erratic. May help escape local minima but convergence is unstable."},
  {t:"Training",q:"What happens if batch size = entire dataset?",a:"Batch gradient descent. Exact gradient. Very slow per update. Uses lots of memory. Can get stuck in local minima because there's no noise."},

  // ── POOLING ──────────────────────────────────────────────────────────────
  {t:"CNN",q:"What does a 2×2 max pooling layer with stride 2 do to a 16×16 feature map?",a:"Reduces it to 8×8. Takes the maximum value in each 2×2 window. Halves spatial dimensions."},
  {t:"CNN",q:"Does max pooling have learnable parameters?",a:"No. Zero parameters. It just takes the max of a window. No weights, no biases."},
  {t:"CNN",q:"What are the benefits of max pooling?",a:"Reduces spatial dimensions (less computation), increases effective receptive field, provides translation invariance (small shifts don't change the max)."},

  // ── WHAT CONV LAYERS LEARN AT DEPTH ──────────────────────────────────────
  {t:"CNN",q:"What do early convolutional layers (layers 1-2) typically learn?",a:"Low-level features: edges, corners, colour blobs, simple textures."},
  {t:"CNN",q:"What do middle convolutional layers (layers 3-5) typically learn?",a:"Mid-level features: textures, patterns, parts of objects (eyes, wheels)."},
  {t:"CNN",q:"What do deep convolutional layers (layers 10+) typically learn?",a:"High-level features: entire object parts, faces, semantic concepts."},
  {t:"CNN",q:"What is the hierarchy of features (low → mid → high) called?",a:"Hierarchical feature learning. It's a key advantage of deep learning over traditional ML where features were hand-crafted."},

  // ── TRANSFER LEARNING DEEPER ─────────────────────────────────────────────
  {t:"Training",q:"When fine-tuning a pre-trained model on a small dataset, which layers do you freeze and which do you retrain?",a:"Freeze early layers (they detect universal features like edges). Retrain the last few layers (task-specific features). This prevents overfitting on the small dataset."},
  {t:"Training",q:"Why do early layers transfer well between tasks?",a:"Early layers detect edges, textures, and shapes — these are universal to all images. A model trained on ImageNet's edges look the same as edges in medical images."},
  {t:"Training",q:"You have 50 images of a rare disease. Should you train a CNN from scratch or use transfer learning?",a:"Transfer learning. 50 images would massively overfit from scratch. A pre-trained model already knows general features — just fine-tune the last layer."},

  // ── ENCODER VS DECODER TRANSFORMERS ──────────────────────────────────────
  {t:"Transformers",q:"BERT is an encoder-only transformer. What does this mean for how it processes text?",a:"Every token attends to ALL other tokens (bidirectional). It sees the full context including future words. Good for understanding text (classification, question answering)."},
  {t:"Transformers",q:"GPT is a decoder-only transformer. What does this mean?",a:"Each token only attends to PREVIOUS tokens (masked attention). Can't see the future. Good for generating text one word at a time."},
  {t:"Transformers",q:"The original Transformer (2017) used encoder-decoder. What is cross-attention?",a:"In the decoder, queries come from the decoder but keys and values come from the encoder output. This lets the decoder attend to the input sequence while generating the output."},
  {t:"Transformers",q:"For machine translation (English → French), which transformer architecture?",a:"Encoder-decoder. Encoder processes the English (bidirectional). Decoder generates French word by word (masked), using cross-attention to look at the English."},

  // ── GENERATIVE MODEL COMPARISONS ─────────────────────────────────────────
  {t:"Generative",q:"What is a VAE (Variational Autoencoder)?",a:"Encoder maps input to a distribution (mean + variance) in latent space. Decoder reconstructs from a sample. Explicitly estimates P(x). Outputs tend to be blurry."},
  {t:"Generative",q:"GAN vs VAE — key difference?",a:"GAN does NOT explicitly model P(x) — it learns implicitly through the adversarial game. VAE explicitly models P(x) through the encoder distribution. GANs produce sharper images but are harder to train."},
  {t:"Generative",q:"What are autoregressive models?",a:"Model P(x) as a product of conditionals: P(x₁)·P(x₂|x₁)·P(x₃|x₁,x₂)... Generate one element at a time. GPT is autoregressive. Sequential but high quality."},
  {t:"Generative",q:"What are normalising flows?",a:"Learn invertible transformations from simple distribution (Gaussian) to data distribution. Can compute P(x) exactly. Mathematically elegant but limited in practice."},

  // ── GAN ARCHITECTURE DETAILS ─────────────────────────────────────────────
  {t:"GANs",q:"In DCGAN, what activation does the generator's final layer use?",a:"Sigmoid (outputs pixel values in [0,1]) or tanh (outputs in [-1,1])."},
  {t:"GANs",q:"In DCGAN, what activation does the discriminator use in hidden layers?",a:"Leaky ReLU (not regular ReLU). Allows small gradients for negative inputs, helping training stability."},
  {t:"GANs",q:"What is transposed convolution?",a:"The reverse of normal convolution. Instead of shrinking spatial dimensions, it expands them. Used in the generator to go from a small noise vector to a full-size image."},
  {t:"GANs",q:"What is mode collapse in GANs?",a:"The generator learns to produce only one type of output (e.g. always the same face) instead of diverse outputs. It found one thing that fools the discriminator and keeps producing it."},
  {t:"GANs",q:"What does the Wasserstein GAN (WGAN) improve over standard GAN?",a:"Replaces the discriminator with a 'critic' that outputs unbounded scores instead of probabilities. Provides more stable and meaningful gradients throughout training."},

  // ── GAN APPLICATIONS ─────────────────────────────────────────────────────
  {t:"GANs",q:"What is image-to-image translation?",a:"Conditional GAN where the condition y is another image. E.g. sketch → photo, segmentation map → realistic image, day → night."},
  {t:"GANs",q:"In SRGAN (super-resolution), what two losses are combined?",a:"(1) GAN loss (is the upscaled image realistic?). (2) Content/perceptual loss (computed on feature maps of a pre-trained CNN like VGG, not pixel-level MSE, to capture high-level structure)."},
  {t:"GANs",q:"Why use perceptual loss instead of pixel-level MSE for super-resolution?",a:"MSE produces blurry images because it averages over all possible solutions. Perceptual loss captures high-level structure (edges, textures) and produces sharper, more realistic results."},

  // ── MULTI-CLASS CROSS-ENTROPY ────────────────────────────────────────────
  {t:"MLP",q:"Multi-class CE formula?",a:"L = −(1/N) Σ Σ y_c × log(ŷ_c). Sum over all classes c for each sample. Only the true class contributes (y_c=1 for true class, 0 for others)."},
  {t:"MLP",q:"Model outputs softmax probabilities [0.7, 0.2, 0.1] for 3 classes. True class is class 1 (first). Loss for this sample?",a:"Only the true class matters. Loss = −log(0.7) = −(−0.357) = 0.357."},
  {t:"MLP",q:"Same model but true class is class 3 (last). Loss?",a:"Loss = −log(0.1) = −(−2.303) = 2.303. Much higher loss because the model only gave 10% probability to the correct class."},

  // ── RNN COMPUTATION ──────────────────────────────────────────────────────
  {t:"RNN/LSTM",q:"RNN with hₜ₋₁=[1,0], xₜ=[0.5], W=[[1,0,2],[0,1,1]], b=[0,0]. Compute hₜ.",a:"Concat: [1,0,0.5]. W×concat: row1: 1+0+1=2, row2: 0+0+0.5=0.5. Add bias: [2, 0.5]. Apply tanh: [0.96, 0.46]."},
  {t:"RNN/LSTM",q:"In hₜ = tanh(W[hₜ₋₁, xₜ] + b), what does the tanh do?",a:"Squishes the output to the range (−1, 1). Keeps values bounded so they don't explode over many time steps."},

  // ── KNOWLEDGE GRAPHS / NEURO-SYMBOLIC ────────────────────────────────────
  {t:"Neuro-Symbolic",q:"Give an example of a knowledge graph triple.",a:"(Paris, capital-of, France). Subject = Paris, predicate = capital-of, object = France. Stored as nodes connected by directed edges."},
  {t:"Neuro-Symbolic",q:"How are knowledge graphs used in neuro-symbolic AI?",a:"They provide structured common-sense knowledge that neural networks lack. E.g. a knowledge graph knows (kangaroo, is-a, animal), so a self-driving car can react to a kangaroo even if kangaroos weren't in training data."},
  {t:"Neuro-Symbolic",q:"What is a knowledge graph embedding?",a:"Representing the nodes and edges of a knowledge graph as vectors in a continuous space. Similar entities end up close together. Enables similarity computation."},
  {t:"Neuro-Symbolic",q:"In Kursuncu et al., how is knowledge injected into BERT?",a:"An attention layer combines BERT's original context with external knowledge from a knowledge base. An option comparison network then selects the best answer."},

  // ── THEORY / HISTORY / MODEL COMPARISONS ─────────────────────────────────
  {t:"Theory",q:"What is the manifold hypothesis?",a:"High-dimensional data (like images) actually lies on a much lower-dimensional smooth surface (manifold). This is why dimensionality reduction works and why neural networks can learn with fewer parameters than the raw dimension suggests."},
  {t:"Theory",q:"Does the Universal Approximation Theorem mean one hidden layer is always enough?",a:"In theory yes, but in practice it might need astronomically many neurones. Deeper networks with fewer neurones per layer are more efficient and learn hierarchical features."},
  {t:"Theory",q:"What is the key difference between deep learning and traditional ML pipelines?",a:"Traditional ML: hand-crafted features → classifier (two separate stages). Deep learning: end-to-end learning, features automatically discovered at multiple levels."},
  {t:"Theory",q:"Why did deep learning take off around 2012?",a:"Three factors converged: (1) massive datasets (ImageNet), (2) GPU hardware enabling parallel computation, (3) software frameworks (TensorFlow, PyTorch)."},
  {t:"Theory",q:"What was AlexNet and why was it important?",a:"A CNN that won ImageNet 2012 by >10% margin over traditional methods. Considered the start of the deep learning era."},
  {t:"Theory",q:"If you remove all non-linear activations from a 10-layer neural network, what happens?",a:"It collapses to a single linear transformation. Same as one layer with no activation. Cannot learn any non-linear patterns regardless of depth."},
  {t:"Theory",q:"Why is the + K (bias) term easy to forget in CNN parameter counting?",a:"There's one bias per filter, not one per weight. For 64 filters of 3×3×32: weights = 64×288 = 18,432. Biases = just 64. Easy to overlook but it's the difference between right and wrong answers on the exam."},
  {t:"Theory",q:"Training loss = 0.01, validation loss = 0.01. Diagnosis?",a:"Excellent. Both very low and very close together. The model has learned the patterns without overfitting."},
  {t:"Theory",q:"Training loss = 0.50, validation loss = 0.50, both decreasing. What should you do?",a:"Continue training. Both are still improving. The model hasn't finished learning yet and there's no overfitting."},
  {t:"Theory",q:"Training loss = 0.01, validation loss = 0.80. What's wrong?",a:"Severe overfitting. The model memorised the training data. Apply dropout, L2 regularisation, data augmentation, or get more data."},
  {t:"Theory",q:"What does a learning rate schedule do?",a:"Starts with a high learning rate (fast progress) and decreases it over time (fine-tuning). E.g. step decay halves the rate every 30 epochs."},
  {t:"Theory",q:"Difference between an epoch and an iteration?",a:"Epoch = one complete pass through the entire dataset. Iteration = one weight update using one mini-batch. If dataset has 10,000 samples and batch size 100, there are 100 iterations per epoch."},
  {t:"Theory",q:"When would you use SVM instead of a neural network?",a:"Small dataset, few features, need interpretability. SVMs work well with limited data and don't need GPUs."},
  {t:"Theory",q:"When would you use a CNN instead of an MLP?",a:"Image data. CNNs preserve spatial structure and use far fewer parameters through local connectivity and parameter sharing."},
  {t:"Theory",q:"When would you use a Transformer instead of an LSTM?",a:"Almost always for text now. Transformers are faster (parallelisable), handle longer sequences, and scale better."},
  {t:"Theory",q:"When would you use a GAN instead of a diffusion model?",a:"GANs are faster at inference (one forward pass). Diffusion models produce higher quality but require many denoising steps. GANs still used for real-time applications."},
  {t:"Theory",q:"What is the progression of models in this module and why?",a:"SVM → MLP → CNN → RNN/LSTM → Transformer → GAN. Each was invented because the previous one failed at something. SVM can't handle images → CNN. CNN can't handle sequences → RNN. RNN is slow → Transformer. All are discriminative → GAN for generation."},

  // ── EXAM TRAPS (True/False) ──────────────────────────────────────────────
  {t:"Exam Traps",q:"True or false: Batch normalisation prevents overfitting.",a:"MOSTLY FALSE. Batch norm's primary purpose is stabilising training (not overfitting). It has a mild regularisation effect as a side effect, but it's NOT a regularisation technique."},
  {t:"Exam Traps",q:"True or false: Dropout is applied during testing.",a:"FALSE. Dropout is ONLY applied during training. During testing the full network is used."},
  {t:"Exam Traps",q:"True or false: Skip connections reduce the number of parameters.",a:"FALSE. Skip connections add ZERO parameters. They're just adding the input to the output (identity shortcut)."},
  {t:"Exam Traps",q:"True or false: The left child in a min-heap is always smaller than the right child.",a:"FALSE. The only rule is parent < both children. Left and right children can be in any order."},
  {t:"Exam Traps",q:"True or false: A* search is always faster than BFS.",a:"FALSE. A* with a bad heuristic (h=0 everywhere) degenerates to Uniform Cost Search. BFS can be faster for unweighted graphs."},
  {t:"Exam Traps",q:"True or false: In a GAN, the generator directly receives feedback on which pixels are wrong.",a:"FALSE. The generator only gets a single signal from the discriminator (real/fake probability). It doesn't know specifically what's wrong — it must figure that out through gradient backpropagation."},
  {t:"Exam Traps",q:"True or false: RBF kernel maps data to a finite-dimensional space.",a:"FALSE. RBF maps to an infinite-dimensional space. That's what makes it so powerful."},
  {t:"Exam Traps",q:"True or false: Increasing the number of layers always improves performance.",a:"FALSE. Without skip connections, very deep networks can perform WORSE than shallow ones due to vanishing gradients (the ResNet observation)."},
  {t:"Exam Traps",q:"True or false: The softmax function can output negative values.",a:"FALSE. Softmax outputs are always between 0 and 1 (because e^x is always positive) and always sum to 1."},
  {t:"Exam Traps",q:"True or false: In masked attention, position i can attend to position i+1.",a:"FALSE. Position i can only attend to positions ≤ i. Position i+1 is in the future and is masked."},

  // ── SVM WORKED EXAMPLES ──────────────────────────────────────────────────
  {t:"SVM",q:"SVM decision boundary is 5x₁ − 12x₂ + 3 = 0. What is the margin width?",a:"w = (5, −12). ‖w‖ = √(25+144) = √169 = 13. Margin = 2/13 = 0.154."},
  {t:"SVM",q:"SVM boundary x₁ + x₂ − 4 = 0. Point x = (1, 1), label y = +1. Is it misclassified?",a:"wᵀx + b = 1 + 1 − 4 = −2. Sign negative, label positive. Signs disagree → misclassified. ξ = max(0, 1−(+1)(−2)) = max(0, 3) = 3."},
  {t:"SVM",q:"SVM with RBF kernel: training accuracy 99%, test accuracy 54%. What's wrong and how to fix it?",a:"Huge gap = overfitting. Decrease γ (smoother boundary) and/or decrease C (tolerate more mistakes)."},
  {t:"SVM",q:"Two points x₁=(0,0), x₂=(3,4). RBF kernel with γ=0.1. What is K(x₁,x₂)?",a:"Distance² = 3² + 4² = 25. K = exp(−0.1 × 25) = exp(−2.5) = 0.082."},
  {t:"SVM",q:"SVM with C=0.001. What kind of margin does it produce?",a:"Small C = tolerates mistakes = wide margin = risk of underfitting."},
  {t:"SVM",q:"Which is NOT true about the kernel trick? (a) Works in higher dimensions (b) You must compute φ(x) explicitly (c) Replaces dot products with kernel functions (d) RBF maps to infinite dimensions",a:"(b) is NOT true. The whole point of the kernel trick is you NEVER compute φ(x) explicitly."},
  {t:"SVM",q:"SVM boundary 2x₁ + x₂ − 3 = 0. Point (2, 1), label y = −1. Status?",a:"wᵀx + b = 4 + 1 − 3 = 2. y(wᵀx+b) = (−1)(2) = −2. Negative → misclassified. ξ = max(0, 1−(−2)) = 3."},
  {t:"SVM",q:"SVM boundary x₁ − x₂ + 1 = 0. Point (0, 1), label y = −1. Status?",a:"wᵀx + b = 0 − 1 + 1 = 0. y(wᵀx+b) = (−1)(0) = 0. Between 0 and 1 → inside margin but on the boundary. ξ = 1."},

  // ── CNN WORKED EXAMPLES ──────────────────────────────────────────────────
  {t:"CNN",q:"Input 32×32×3, 16 filters of 5×5, stride 1, padding 0. Output volume?",a:"W₂ = (32−5+0)/1 + 1 = 28. Output: 28 × 28 × 16."},
  {t:"CNN",q:"Input 32×32×3, 16 filters of 5×5, stride 1, padding 0. How many parameters?",a:"16 × (5×5×3) + 16 = 16 × 75 + 16 = 1200 + 16 = 1,216."},
  {t:"CNN",q:"Input 14×14×6, output 10×10×8, stride 1, padding 0. What is the filter size?",a:"10 = (14 − F)/1 + 1 → F = 5. Filters are 5×5."},
  {t:"CNN",q:"Input 14×14×6, 8 filters of 5×5. How many parameters?",a:"8 × (5×5×6) + 8 = 8 × 150 + 8 = 1,208."},
  {t:"CNN",q:"Input 20×20×16, 32 filters of 3×3, stride 2, padding 1. Output volume?",a:"W₂ = (20−3+2)/2 + 1 = 19/2 + 1 = 10.5 → 10. Output: 10 × 10 × 32."},
  {t:"CNN",q:"100×100×3 image. FC layer with 64 outputs vs conv layer with 64 filters of 3×3. How many times more params does FC have?",a:"FC: (30000×64)+64 = 1,920,064. Conv: 64×(9×3)+64 = 1,792. Ratio ≈ 1,071 times more. CNNs are massively more efficient."},
  {t:"CNN",q:"Two stacked 3×3 conv layers. What is the receptive field?",a:"5×5. Each 3×3 layer adds 2 to the receptive field: 3 + (3−1) = 5."},

  // ── ACTIVATION WORKED EXAMPLES ───────────────────────────────────────────
  {t:"MLP",q:"Perceptron with w=[2,−1,3], b=−0.5, ReLU activation. Input x=[1,4,0]. Output?",a:"wᵀx+b = 2−4+0−0.5 = −2.5. ReLU(−2.5) = max(0, −2.5) = 0."},
  {t:"MLP",q:"Perceptron with w=[1,1], b=0, sigmoid activation. Input x=[0,0]. Output?",a:"wᵀx+b = 0. sigmoid(0) = 1/(1+1) = 0.5."},
  {t:"MLP",q:"Softmax on logits [2, 1, 0]. Probability of first class?",a:"e²=7.389, e¹=2.718, e⁰=1. Sum=11.107. P(class 1) = 7.389/11.107 = 0.665."},
  {t:"MLP",q:"Softmax on logits [3, 3, 3]. What are the probabilities?",a:"All equal → [0.33, 0.33, 0.33]. Equal scores always give equal probabilities."},
  {t:"MLP",q:"Which activation for hidden layers of a modern neural network?",a:"ReLU. Computationally efficient, mitigates vanishing gradients, standard default."},
  {t:"MLP",q:"Which activation for the output layer predicting cat vs dog vs bird?",a:"Softmax (multi-class classification, 3+ classes). Gives probabilities summing to 1."},
  {t:"MLP",q:"Which activation for the output layer predicting spam/not spam?",a:"Sigmoid (binary classification). Outputs one probability between 0 and 1."},

  // ── PARAMETER COUNTING WORKED ────────────────────────────────────────────
  {t:"MLP",q:"FC layers: 784 inputs → 256 outputs → 10 outputs. Total parameters?",a:"Layer 1: (784×256)+256 = 200,960. Layer 2: (256×10)+10 = 2,570. Total: 203,530."},
  {t:"CNN",q:"Conv layer: 64 filters of 3×3, input depth 32. Parameters?",a:"64 × (3×3×32) + 64 = 64×288 + 64 = 18,432 + 64 = 18,496."},

  // ── LOSS WORKED EXAMPLES ─────────────────────────────────────────────────
  {t:"MLP",q:"MSE loss. Actual: [3, 1, 4, 2]. Predicted: [2.5, 1.5, 3, 2]. What is the loss?",a:"Errors²: 0.25, 0.25, 1.0, 0. Sum=1.5. MSE = 1.5/4 = 0.375."},
  {t:"MLP",q:"BCE loss. y=[1, 0, 1], ŷ=[0.9, 0.2, 0.4]. What is the loss?",a:"y=1→ln(0.9)=−0.105. y=0→ln(0.8)=−0.223. y=1→ln(0.4)=−0.916. Sum=−1.244. ÷3=−0.415. Negate=0.415."},
  {t:"MLP",q:"Which loss function for predicting house prices?",a:"MSE (mean squared error). Regression task with continuous output."},

  // ── GRADIENT DESCENT WORKED ──────────────────────────────────────────────
  {t:"Training",q:"w=3.0, η=0.1, gradient=4.0. New w after one update?",a:"w = 3.0 − 0.1×4.0 = 3.0 − 0.4 = 2.6."},
  {t:"Training",q:"w=5.0, η=0.5. Gradients for 3 steps: 2.0, 1.0, −1.0. Final w?",a:"Step 1: 5.0−0.5×2.0=4.0. Step 2: 4.0−0.5×1.0=3.5. Step 3: 3.5−0.5×(−1.0)=4.0. Final w=4.0."},
  {t:"Training",q:"6400 samples, batch size 128. How many iterations per epoch?",a:"6400/128 = 50 iterations."},
  {t:"Training",q:"6400 samples, batch size 128, training for 3 epochs. Total weight updates?",a:"50 × 3 = 150 updates."},

  // ── TRAINING DIAGNOSIS WORKED ────────────────────────────────────────────
  {t:"Training",q:"Training loss barely decreases. 20 layers with sigmoid. What's wrong?",a:"Vanishing gradients. Sigmoid derivative max=0.25, gradient shrinks to ~0 through 20 layers. Fix: use ReLU."},
  {t:"Training",q:"Training accuracy 98%, validation accuracy 62%. What's the problem and which TWO techniques help?",a:"Overfitting (big gap). Use dropout and/or L2 regularisation. NOT ReLU or skip connections (those fix vanishing gradients)."},
  {t:"Training",q:"Which is NOT designed to prevent overfitting? (a) Dropout (b) L2 regularisation (c) Xavier initialisation (d) Early stopping",a:"(c) Xavier initialisation. It prevents vanishing/exploding gradients, NOT overfitting."},
  {t:"Training",q:"Training loss 0.12, validation loss 0.11, both still decreasing. What should you do?",a:"Continue training. Both losses are low, close together, and still improving. No overfitting."},
  {t:"Training",q:"What are the TWO primary purposes of ResNet skip connections?",a:"(1) Mitigate vanishing gradients (gradient is always at least 1). (2) Allow deeper networks to learn effectively."},
  {t:"Training",q:"Loss oscillates wildly, sometimes increasing. What's wrong?",a:"Learning rate too high. Overshooting the minimum. Fix: decrease learning rate."},
  {t:"Training",q:"What does dropout rate 0.4 mean?",a:"40% of neurones randomly deactivated each training iteration. Different ones each time. Only during training, NOT during testing."},
  {t:"Training",q:"L1 vs L2 regularisation — key difference?",a:"L1 pushes weights to exactly 0 (feature selection). L2 makes weights small but not zero."},
  {t:"Training",q:"Early stopping with patience=5. Val loss improves at epoch 20, worsens for 4 epochs, then improves at epoch 25. Does training stop?",a:"No. The counter reached 4 but improved at epoch 25 before reaching 5. Counter resets."},
  {t:"Training",q:"Match technique to purpose: (a) ReLU (b) Dropout (c) Skip connections (d) L2 regularisation (e) He initialisation",a:"(a) Vanishing gradients. (b) Overfitting. (c) Vanishing gradients. (d) Overfitting. (e) Vanishing/exploding gradients at initialisation."},
  {t:"Training",q:"500 labelled X-ray images, want to detect fractures. Best approach?",a:"Transfer learning. Use a model pre-trained on ImageNet and fine-tune on the small dataset. Training from scratch would overfit."},
  {t:"Training",q:"Adam optimiser — what are its two advantages over standard SGD?",a:"(1) Automatically adjusts learning rate per parameter. (2) Works well without extensive tuning — good defaults."},
  {t:"Training",q:"Training loss=0.82, validation loss=0.85. Both barely decreasing. What's wrong?",a:"Underfitting. Both losses are high with small gap. Model too simple. Fix: more layers/neurones, train longer, check for vanishing gradients."},

  // ── SELF-ATTENTION WORKED ────────────────────────────────────────────────
  {t:"Transformers",q:"q=[1,1,0], k₁=[1,1,0], k₂=[0,1,1], v₁=[1,2,2], v₂=[3,4,3]. Compute self-attention output (ignore scaling).",a:"Scores: q·k₁=1+1+0=2, q·k₂=0+1+0=1. Softmax: α₁=e²/(e²+e¹)=7.389/10.107=0.731, α₂=0.269. Output: 0.731×[1,2,2]+0.269×[3,4,3] = [1.54, 2.54, 2.27]."},
  {t:"Transformers",q:"q=[2,1,0], k₁=[1,0,0], k₂=[0,1,0], v₁=[4,2,1], v₂=[2,6,3]. Compute output (ignore scaling).",a:"Scores: q·k₁=2, q·k₂=1. Softmax: α₁=0.731, α₂=0.269. Output: 0.731×[4,2,1]+0.269×[2,6,3] = [3.46, 3.08, 1.54]."},
  {t:"Transformers",q:"q=[0,1,2], k₁=[1,1,0], k₂=[2,0,1]. Scores?",a:"q·k₁=0+1+0=1. q·k₂=0+0+2=2. Scores: [1, 2]. k₂ has higher score, so output leans toward v₂."},
  {t:"Transformers",q:"After softmax, weights are [0.731, 0.269]. Sanity check?",a:"Must sum to 1: 0.731+0.269=1.000 ✓. Output must lean toward the v with weight 0.731."},

  // ── MASKED ATTENTION WORKED ──────────────────────────────────────────────
  {t:"Transformers",q:"Position i=3 (0-indexed), sequence length 5. Scores: [1.5, 2.0, 0.5, 3.0, 1.0]. Masked scores?",a:"Position 3 sees positions 0,1,2,3 (j≤3). Mask position 4. Result: [1.5, 2.0, 0.5, 3.0, −∞]."},
  {t:"Transformers",q:"Position i=1 (0-indexed), sequence length 6. Scores: [4.0, 2.5, 1.0, 3.0, 0.5, 2.0]. Masked scores?",a:"Position 1 sees positions 0 and 1. Mask rest. Result: [4.0, 2.5, −∞, −∞, −∞, −∞]."},

  // ── MULTI-HEAD WORKED ────────────────────────────────────────────────────
  {t:"Transformers",q:"8 heads, input D=512, each head D'=64. What is the Wo matrix size?",a:"Concatenated = 8×64 = 512. Wo maps 512→512. Size: 512×512."},
  {t:"Transformers",q:"6 heads, D'=48, input D=512. What is the Wo matrix size?",a:"Concatenated = 6×48 = 288. Wo maps 288→512. Size: 288×512."},

  // ── POSITIONAL ENCODING WORKED ───────────────────────────────────────────
  {t:"Transformers",q:"Which is NOT a requirement for positional encoding? (a) Unique per position (b) Monotonically increasing (c) Bounded (d) Consistent distance",a:"(b) Monotonically increasing. Sinusoidal encodings oscillate up and down."},
  {t:"Transformers",q:"What happens if you remove positional encoding from a transformer?",a:"It treats words as an unordered set. 'Dog bites man' and 'Man bites dog' would produce identical results."},

  // ── TRANSFORMER CONCEPTS ─────────────────────────────────────────────────
  {t:"Transformers",q:"Layer norm vs batch norm — which is used in transformers and why?",a:"Layer norm. It normalises across features for each individual token. Works for variable-length sequences. Batch norm normalises across the batch and is used in CNNs."},
  {t:"Transformers",q:"What does the feed-forward network in a transformer do?",a:"Two FC layers with ReLU between, applied to each token independently. No interaction between tokens."},

  // ── GAN WORKED EXAMPLES ──────────────────────────────────────────────────
  {t:"GANs",q:"Generator produces 3 fakes. D(G(z))=[0.2, 0.5, 0.8]. Which fake image was the generator's biggest failure?",a:"z₁ (D=0.2). The discriminator was 80% sure it was fake. ln(0.2)=−1.609 contributes the most to the loss."},
  {t:"GANs",q:"D(G(z))=0.5 for all fakes. Generator loss?",a:"−ln(0.5) = 0.693. The discriminator is at maximum uncertainty."},
  {t:"GANs",q:"D(G(z))=1.0 for a fake. Generator loss for that image?",a:"−ln(1.0) = 0. Perfect — the discriminator is completely fooled."},
  {t:"GANs",q:"Real D(x₁)=0.9, D(x₂)=0.7. Fake D(G(z₁))=0.2, D(G(z₂))=0.4. Discriminator loss?",a:"Real: ln(0.9)+ln(0.7)=−0.105+(−0.357)=−0.462. Fake: ln(0.8)+ln(0.6)=−0.223+(−0.511)=−0.734. Total: −1.196. ÷2=−0.598. Negate=0.598."},
  {t:"GANs",q:"What happens during generator training?",a:"Only generator weights update. Discriminator is frozen (gradients flow through it but its weights don't change)."},
  {t:"GANs",q:"What does the discriminator want D(x) to be for real images?",a:"Close to 1 (correctly identifies as real)."},
  {t:"GANs",q:"What does the discriminator want D(G(z)) to be for fake images?",a:"Close to 0 (correctly identifies as fake)."},
  {t:"GANs",q:"What does the generator want D(G(z)) to be?",a:"Close to 1 (fools the discriminator into thinking fake is real)."},
  {t:"GANs",q:"Generator loss=0.02, discriminator loss=3.5. What's happening?",a:"Generator is winning. It's fooling the discriminator almost completely."},
  {t:"GANs",q:"In a conditional GAN, what is the condition y?",a:"A label (e.g. class, text description) concatenated with the noise for G and with the image for D. Controls what gets generated."},

  // ── RNN/LSTM EXTRA ───────────────────────────────────────────────────────
  {t:"RNN/LSTM",q:"In hₜ = tanh(W[hₜ₋₁, xₜ] + b), what does [hₜ₋₁, xₜ] mean?",a:"Concatenate (glue together) the previous hidden state and the current input into one long vector."},
  {t:"RNN/LSTM",q:"Why do all LSTM gates use sigmoid?",a:"They need to output between 0 and 1 to act as 'how much to let through' controls. 0=block, 1=pass."},

  // ── PROBABILITY / SEARCH / ADVERSARIAL WORKED ────────────────────────────
  {t:"Probability",q:"P(Disease)=0.01, P(Pos|Disease)=0.95, P(Pos|No Disease)=0.10. Person tests positive. P(Disease|Positive)?",a:"P(Pos)=0.95×0.01+0.10×0.99=0.0095+0.099=0.1085. P(Disease|Pos)=0.0095/0.1085=0.088. Only 8.8%."},
  {t:"Probability",q:"Naive Bayes: P(Buy)=0.4, P(NotBuy)=0.6, P(Young|Buy)=0.7, P(Young|NotBuy)=0.3, P(High|Buy)=0.8, P(High|NotBuy)=0.5. Young, high-income customer — predict?",a:"Buy: 0.4×0.7×0.8=0.224. NotBuy: 0.6×0.3×0.5=0.090. 0.224>0.090 → predict Buy."},
  {t:"Adversarial",q:"Minimax tree: MAX at top. Left MIN chooses min(7,2)=2. Right MIN chooses min(5,9,1)=1. What does MAX choose?",a:"max(2, 1) = 2. MAX picks the left branch."},
  {t:"Search",q:"In A*, f(n) = g(n) + h(n). Node X: g=8, h=2. Node Y: g=3, h=6. Which expands next?",a:"f(X)=10, f(Y)=9. A* picks lowest f → Node Y."},
  {t:"Search",q:"A heuristic estimates cost to goal as 12, but true cost is 10. Is it admissible?",a:"No. 12 > 10. Admissible means never overestimates. h(n) must be ≤ true cost."},

  // ── VELASQUEZ PAPER (2025): Neurosymbolic AI as an antithesis to scaling laws ──
  {t:"Velasquez Paper",q:"What is the central thesis of the Velasquez et al. (2025) paper?",a:"Neurosymbolic AI is an ANTITHESIS to scaling laws. The current trend of scaling up data, parameters, and compute is unsustainable and creates gatekeeping. Integrating symbolic structures and reasoning into neural models delivers efficient, generalisable AI with much less data and power."},
  {t:"Velasquez Paper",q:"What three resources do AI scaling laws assume must grow?",a:"(1) Training data, (2) computing power, (3) model parameters. Velasquez argues neurosymbolic AI can reduce all three simultaneously while preserving (or improving) generalisation."},
  {t:"Velasquez Paper",q:"How fast are AI model parameters doubling, and how does this compare to Moore's law?",a:"AI parameters roughly double every 6 months — about 4× faster than Moore's law (transistors doubled every ~2 years). Some NLP performance benchmarks double every 4 months. The lecture notes ~5% of US electricity already goes to AI."},
  {t:"Velasquez Paper",q:"What does the paper say about AI's energy footprint?",a:"AI data centres account for up to 3.7% of global greenhouse emissions. Training GPT-3 used 1.287 GWh. The human brain runs on ~20W — equivalent to 3.15 MWh over 18 years — and generalises from far fewer data points."},
  {t:"Velasquez Paper",q:"What was the estimated cost of training Gemini Ultra and why does this matter?",a:"$191 million. This creates GATEKEEPING — only large tech companies can train state-of-the-art AI. Combined with closed-source releases, this raises trustworthiness concerns about opaque models proliferating widely."},
  {t:"Velasquez Paper",q:"Summarise the 'bitter lesson' (Sutton 2019) and how Velasquez critiques it.",a:"Sutton argues only the leveraging of computation matters in the long run — general-purpose data-driven methods beat human-engineered ones. Velasquez critiques on three fronts: (1) human brain shows data-efficient intelligence at 20W is possible; (2) AlphaStar needed 987,000 human replays to surpass humans; (3) Zhang et al. show models can't truly REASON — they pattern-match on training distribution."},
  {t:"Velasquez Paper",q:"What complementary scaling law did Moore's law have, and why does this analogy matter?",a:"DENNARD SCALING — power per transistor scaled DOWN exponentially as Moore's law scaled transistor count UP, keeping power density constant. AI scaling has no such counterbalance. Velasquez positions neurosymbolic AI as that missing counterbalance to bound the resource demands."},

  // Theoretical foundations
  {t:"Velasquez Paper",q:"State the manifold hypothesis and its role in the paper's argument.",a:"The manifold hypothesis: high-dimensional data that shares simple features (e.g. all faces have eyes) actually lies on a smooth lower-dimensional MANIFOLD. Neural networks are effective at traversing SMOOTH manifolds. The smoother, the easier to learn — which is why scaling promotes smoothness."},
  {t:"Velasquez Paper",q:"State the Universal Approximation Theorem and its role.",a:"Given enough parameters, a neural network can approximate any continuous function (any manifold representation) to arbitrary precision. This is the THEORETICAL basis for why scaling parameters works — together with the manifold hypothesis it explains why bigger neural networks fit better."},
  {t:"Velasquez Paper",q:"What are 'sharp regions' of a loss landscape and why are they a problem?",a:"Non-smooth regions of the objective surface — cliffs, tears, sharp valleys. Neural networks struggle there (poor local optima). Conventional ML scales up data/parameters to PROMOTE smoothness. But sharpness is unavoidable in practice (hence sharpness-aware training algorithms). This is the core inefficiency Velasquez targets."},
  {t:"Velasquez Paper",q:"How does the neurosymbolic feedback loop address sharpness without scaling?",a:"Instead of smoothing via scale, the architecture LIFTS the parameter space around sharp regions into a SYMBOLIC space, performs symbolic computation to traverse the sharp region, then PROJECTS back to a smooth submanifold. The learning problem decomposes into smooth submanifolds connected by symbolic jumps — small neural networks suffice on each smooth piece."},

  // Architecture
  {t:"Velasquez Paper",q:"What are the four steps of the neurosymbolic feedback loop in Velasquez Fig. 1?",a:"(1) DATA-DRIVEN UPDATE — conventional gradient descent on the neural model. (2) LIFT — translate neural representation into a symbolic one. (3) SYMBOLIC UPDATE — perform logical/physical reasoning at the symbolic level. (4) PROJECT — map the symbolic representation back into neural space. The loop iterates."},
  {t:"Velasquez Paper",q:"What does the LIFT operation mean concretely?",a:"Translating a neural representation into a symbolic one — going from continuous neural parameters to discrete symbolic structures. Examples: interpreting quantised network weights as letters in a vocabulary; extracting a deterministic finite automaton from a recurrent net's activations via grammatical inference."},
  {t:"Velasquez Paper",q:"What does the PROJECT operation mean concretely?",a:"Mapping a symbolic representation back into neural space. Examples: encoding PDEs into the loss function (physics-informed neural networks); translating logical constraints into differentiable losses (Ahmed et al. 2022, semantic probabilistic layers); embedding knowledge graphs in vector spaces."},
  {t:"Velasquez Paper",q:"List the five forms of prior symbolic knowledge shown in Fig. 1.",a:"(1) Equations (e.g. PDEs). (2) Finite state machines. (3) Logical constraints. (4) Relational graphs (knowledge graphs). (5) Visual concepts. These are the symbolic structures that can be projected into neural models or extracted from them."},

  // Symbolic forms
  {t:"Velasquez Paper",q:"What is a partial differential equation (PDE) as a symbolic form?",a:"A mathematical equation involving partial derivatives that encodes a physical law (conservation of mass/energy/momentum). DIFFERENTIABLE — can be embedded into a neural network's loss function. Encodes human domain knowledge as an INDUCTIVE BIAS that constrains learned behaviour."},
  {t:"Velasquez Paper",q:"What is a knowledge graph as a symbolic form?",a:"A graph of semantic relations across objects. Stored as triples (subject, predicate, object), e.g. (Paris, capital-of, France). Subjects/objects are nodes; predicates are directed edges. INTERPRETABLE, REUSABLE across tasks, expandable by humans — unlike monolithic neural training which tangles data, representation, and downstream tasks."},
  {t:"Velasquez Paper",q:"What are logical constraints translated into differentiable losses (Ahmed et al. 2022)?",a:"Symbolic probabilistic layers convert logical formulas into a differentiable loss term that penalises constraint violations. This embeds symbolic knowledge directly into the neural network while preserving end-to-end differentiability for training."},
  {t:"Velasquez Paper",q:"What is a deterministic finite automaton (DFA) as a symbolic form, and where is it used?",a:"A finite state machine that accepts/rejects strings based on state-transition rules. Used in Ctrl-G to encode logical constraints that LLM outputs must satisfy. Also used as compact symbolic abstractions of recurrent neural network behaviour (Carr et al., Koul et al.)."},
  {t:"Velasquez Paper",q:"What is a hidden Markov model in this paper's context?",a:"A tractable probabilistic graphical model. In Ctrl-G, a large LLM is DISTILLED into a small HMM (2B parameters) that supports efficient symbolic reasoning about DFA-encoded constraints during generation."},

  // Problem domains (essay Q2 building blocks)
  {t:"Velasquez Paper",q:"Describe the physics-informed ML domain covered by the paper.",a:"Neural networks that incorporate physics knowledge (PDEs, conservation laws) as inductive biases. Includes physics-informed neural networks (PINNs, Raissi et al.), physics-informed neural operators, differentiable simulation, neural constitutive laws, and PAC-NeRF. Used in climate modelling, deformation dynamics, and rendering."},
  {t:"Velasquez Paper",q:"What are neural constitutive laws (Ma et al. 2023)?",a:"PDE terms are themselves parameterised by small neural networks. Integrated within differentiable simulations comparing generated to ground-truth video. By using physical PDE priors as inductive bias, the model GENERALISES to new geometries and initial/boundary conditions from minimal data — a single training video — which purely neural approaches cannot achieve."},
  {t:"Velasquez Paper",q:"What is PAC-NeRF and what does it demonstrate?",a:"Physics-Augmented Continuum Neural Radiance Fields. Augments NeRF with physics-based material point methods so rendered results obey conservation laws of mechanics. Accelerates rendering by 2 ORDERS OF MAGNITUDE over NeRF baselines while improving physical realism."},
  {t:"Velasquez Paper",q:"What is PhysORD (Zhao et al. 2024) and what efficiency does it achieve?",a:"PhysORD: a neurosymbolic approach for physics-infused motion prediction in OFF-ROAD AUTONOMOUS DRIVING. Co-designs neural networks for estimating physical variables AND the symbolic equations governing conservation laws. Matches state-of-the-art motion prediction with 0.1% of the training time, 1% of the training data, and 96.9% fewer parameters. With further training: 46% performance improvement over SOTA."},
  {t:"Velasquez Paper",q:"What is Amazon's COSMO framework?",a:"A large-scale common-sense KNOWLEDGE GRAPH built from customer interaction data using LLMs. Powers Amazon's recommendation engine by inferring relationships between products and human contexts (functions, audiences). Demonstrates neurosymbolic integration of knowledge graphs with LLMs at industrial scale."},
  {t:"Velasquez Paper",q:"What is GraphRAG (Edge et al. 2024)?",a:"Automatic knowledge-graph extraction from a corpus of text data. The extracted KG is incorporated into the retrieval-augmented generation process for LLMs. Allows LLMs to access STRUCTURED relational knowledge during generation rather than relying purely on statistical pattern matching."},
  {t:"Velasquez Paper",q:"What is Ctrl-G (Zhang et al. 2024) and what does it demonstrate?",a:"Ctrl-G takes user LOGICAL CONSTRAINTS as input, encoded as DETERMINISTIC FINITE AUTOMATA, and distills a small LLM whose generated text satisfies them. Combines a 7B LLM with a 2B-parameter hidden Markov model for symbolic reasoning. OUTPERFORMED GPT-3.5 (175B) and GPT-4 (~1T) by over 30% in human evaluation — small neurosymbolic models can beat models 100× larger."},
  {t:"Velasquez Paper",q:"What is symbolic knowledge distillation (West et al. 2022)?",a:"Common-sense knowledge is distilled from GPT-3 into (1) a common-sense KNOWLEDGE GRAPH and (2) a corresponding neural model that is 100× SMALLER than GPT-3 while achieving SUPERIOR common-sense reasoning. Shows knowledge graphs can compress and improve neural reasoning."},
  {t:"Velasquez Paper",q:"What is the symbolic distillation of finite state machines from RNNs?",a:"Carr et al. (2021) and Koul et al. (2019) quantize RNN weights/activations, then use grammatical inference on the quantised values to extract a FINITE STATE MACHINE that is much smaller than the RNN but captures relevant dynamics. Enables verifiable POMDP policies."},
  {t:"Velasquez Paper",q:"What is QLoRA and why is it relevant?",a:"Quantised Low-Rank Adaptation (Dettmers et al. 2023). Quantises LLM weights down to 4 BITS. An example of symbolic-style discretisation that improves efficiency without losing performance — symbolic representations can be encoded in far fewer bits than continuous weights."},

  // Neurons-to-symbols direction
  {t:"Velasquez Paper",q:"What is the 'from symbols to neurons' direction?",a:"Embedding pre-existing symbolic knowledge INTO neural models. Examples: encoding PDEs into the loss (PINNs); embedding knowledge graphs in vector spaces; translating logical constraints into differentiable losses; using formal-verification feedback as a fine-tuning reward signal."},
  {t:"Velasquez Paper",q:"What is the 'from neurons to symbols' direction (symbolic distillation)?",a:"Extracting symbolic representations FROM a trained neural model. Examples: quantising activations to atomic propositions and applying grammatical inference to extract a DFA or knowledge graph (Acharya et al. 2024 survey); using formal model-checking to rank outputs and fine-tune with that ranking; treating an LLM as an oracle and learning a DFA from its responses (Chen et al. 2024)."},
  {t:"Velasquez Paper",q:"What is grammatical inference in this context?",a:"A classical AI technique for inferring a formal language (regular grammar, DFA) from observed strings. Applied to quantised neural network activations: the 2ⁿ possible values become 'atomic propositions' and observed sequences are used to learn a symbolic automaton describing the network's behaviour."},

  // Psychological perspective
  {t:"Velasquez Paper",q:"What are dual-process theories (Kahneman, Sun)?",a:"Cognitive psychology theories positing TWO modes of knowledge representation: System 1 (subsymbolic, implicit, parallel, fast, automatic) and System 2 (symbolic, explicit, sequential, slow, deliberate). The two complement each other — habit lets System 1 take over once System 2 has learned the task."},
  {t:"Velasquez Paper",q:"Distinguish System 1 and System 2 thinking with the paper's examples.",a:"SYSTEM 1: fast, automatic, intuitive — e.g. 5 × 4 = 20 (instant). Maps to subsymbolic/neural processing. Learns slowly via trial and error but applies instantly once learned. SYSTEM 2: slow, deliberate, effortful — e.g. 547 × 27 (requires steps). Maps to symbolic processing. Can learn quickly but applies slowly."},
  {t:"Velasquez Paper",q:"How does the driving analogy in the paper illustrate symbolic-neural complementarity?",a:"Novice driver relies on SYMBOLIC rules ('stay 2 seconds behind', 'stop at red') as guardrails. With experience, the perceptuomotor (subsymbolic) system trains itself — stopping at red becomes automatic. In a NEW context (one-pedal driving), the driver INDUCES new symbolic rules to bootstrap learning. Both modes are essential, not hierarchical."},
  {t:"Velasquez Paper",q:"Why is the compositional nature of symbolic knowledge important?",a:"A small number of compositional symbolic rules covers a vast variety of scenarios — just as a small number of words + grammar covers infinite sentences. Symbolic knowledge provides a COMPOSITIONAL INDUCTIVE BIAS that gets the agent into the neighbourhood of optimal solutions, especially outside the familiar operational regime."},
  {t:"Velasquez Paper",q:"How does symbolic knowledge help escape local minima?",a:"If a neural agent is stuck in a local minimum, symbolic knowledge provides GUIDED EXPLORATION toward a better solution. Example: a novice driver struggling with parallel parking can 'talk themselves through it' using symbolic knowledge of geometric and causal relationships — analogous to chain-of-thought reasoning in LLMs."},

  // Critique and evidence
  {t:"Velasquez Paper",q:"What does Zhang et al. (2023) reveal about pure scaling?",a:"Large neural models LACK true reasoning abilities. They rely on statistical data patterns that don't suffice for generalising within the same family of reasoning tasks, let alone out-of-distribution. Near-perfect accuracy on one distribution; failure on a related one. Models LEARN PATTERNS, not REASONING."},
  {t:"Velasquez Paper",q:"Contrast the AlphaGo Zero and AlphaStar examples in the paper.",a:"AlphaGo Zero: pure self-play with no human tactics — discovered the famous 'move 37' and beat all baselines. Supports the bitter lesson. AlphaStar (StarCraft II): the ablated version WITHOUT 987,000 human replays significantly underperformed amateurs. Human-derived knowledge (inductive bias) can be essential, not optional. Together: discovery and prior knowledge are NOT mutually exclusive."},
  {t:"Velasquez Paper",q:"What is the 'carry the 1' analogy in the paper?",a:"If a child cannot solve multi-digit addition, the symbolic hint 'carry the 1' guides them into a learning space where they can productively generalise (e.g. to 'carry the 2'). Analogously, neurosymbolic systems use human-derived rules as inductive biases that ENABLE rather than constrain discovery."},
  {t:"Velasquez Paper",q:"What does Villalobos et al. (2024) say about data scarcity?",a:"There may not be enough high-quality data, even in principle, to sustain data-driven improvements in frontier LLMs. Some domains (AI on the edge, low-power/size/weight systems) are inherently data- and compute-limited. In such cases, strong inductive biases (symbolic knowledge) are necessary."},
  {t:"Velasquez Paper",q:"Summarise the four quantitative efficiency results in the paper.",a:"(1) PhysORD: SOTA motion prediction with 0.1% training time, 1% data, 96.9% fewer parameters. (2) Ctrl-G: 7B + 2B hybrid beats GPT-3.5 (175B) and GPT-4 (~1T) by 30%+ on human evaluation. (3) West et al.: 100× smaller model with SUPERIOR common-sense reasoning vs GPT-3. (4) Bhagat et al.: 95% smaller models outperform neural-only baselines by 2% on few-shot object learning."},

  // Essay-targeted
  {t:"Velasquez Paper",q:"ESSAY Q1 PREP — symbolic forms in PHYSICS-INFORMED ML?",a:"The symbolic component takes the form of PARTIAL DIFFERENTIAL EQUATIONS (PDEs) — mathematical expressions of physical laws such as conservation of mass, momentum, and energy. PDEs are applicable because they are DIFFERENTIABLE and can be integrated directly into a neural network's loss function (physics-informed neural networks, Raissi et al. 2019). They encode human domain knowledge as an INDUCTIVE BIAS. In neural constitutive laws (Ma et al. 2023), PDE terms are themselves parameterised by small neural networks within a differentiable simulation, enabling generalisation to new geometries and initial/boundary conditions from a single training video — a feat impossible for purely neural approaches."},
  {t:"Velasquez Paper",q:"ESSAY Q1 PREP — symbolic forms in the LLM / KNOWLEDGE GRAPH domain?",a:"The symbolic component takes the form of KNOWLEDGE GRAPHS — graph structures of semantic relations encoded as triples (subject, predicate, object), e.g. (kangaroo, is-a, animal). They are applicable because LLMs lack grounded common-sense relations: Amazon's COSMO framework uses LLMs to build large-scale common-sense knowledge graphs from customer interactions, enabling the recommendation engine to infer product-context relationships (function, audience) that pure embeddings cannot. GraphRAG automatically extracts knowledge graphs from text to augment retrieval-augmented generation. Unlike monolithic deep learning, knowledge graphs SEPARATE data, representation, and downstream tasks — they are interpretable, expandable, and reusable across problems."},
  {t:"Velasquez Paper",q:"ESSAY Q1 PREP — symbolic forms in CONSTRAINED TEXT GENERATION (Ctrl-G)?",a:"The symbolic component takes the form of LOGICAL CONSTRAINTS encoded as DETERMINISTIC FINITE AUTOMATA (DFAs). A DFA is a finite state machine that accepts only strings satisfying given transition rules. It is applicable to text generation because user requirements (must contain certain phrases, must avoid forbidden content, must follow a structural template) can be precisely expressed as automata — unlike statistical pattern matching, this provides PROVABLE adherence. In Ctrl-G, a large LLM is distilled into a tractable HIDDEN MARKOV MODEL (also symbolic) that supports efficient reasoning over the DFA constraints, yielding generated text that provably satisfies them."},
  {t:"Velasquez Paper",q:"ESSAY Q2 PREP — neurosymbolic approach for PHYSICS-INFORMED ML?",a:"The approach interleaves data-driven and symbolic computation in a feedback loop. Physical knowledge in the form of PDEs is PROJECTED into the neural model by integration into the loss function (physics-informed neural networks), so the trained model satisfies conservation laws by construction. In neural constitutive laws, individual PDE terms are PARAMETERISED by small neural networks within differentiable simulations, allowing data-driven correction of imperfect priors. The system is trained against a visual loss comparing the simulated dynamics to ground-truth video. By embedding physical inductive biases, the system generalises from minimal data (a single video) to unseen geometries and boundary conditions — and achieves, in PhysORD, state-of-the-art motion prediction with 1% of the data and 96.9% fewer parameters."},
  {t:"Velasquez Paper",q:"ESSAY Q2 PREP — neurosymbolic approach for CTRL-G CONSTRAINED LLM GENERATION?",a:"Ctrl-G accepts user-specified LOGICAL CONSTRAINTS encoded as DETERMINISTIC FINITE AUTOMATA. It DISTILS a production-ready LLM into a tractable probabilistic model — a hidden Markov model — that supports efficient symbolic reasoning over the DFA constraints. At generation time, the 7B-parameter LLM produces text candidates and the distilled 2B-parameter HMM symbolically scores them against the DFA: candidates that traverse to an accepting state are favoured. This combines the LLM's broad language coverage (system 1) with the HMM-and-DFA's exact constraint reasoning (system 2). In human evaluation the hybrid outperformed GPT-3.5 (175B) and GPT-4 (~1T) by over 30% on text quality plus constraint adherence — demonstrating that small neurosymbolic models can outperform models 100× larger."},
